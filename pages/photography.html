  <!-- Hover preview image -->
  <div class="hover-preview" id="hoverPreview">
    <img id="hoverPreviewImage" src="" alt="">
  </div>

  <script src="../js/scroll.js"></script>
  <script>
    const preview = document.getElementById("hoverPreview");
    const previewImage = document.getElementById("hoverPreviewImage");
    const hoverLinks = document.querySelectorAll(".project-overlay a[data-image]");

    hoverLinks.forEach(link => {
      link.addEventListener("mouseenter", () => {
        previewImage.src = link.dataset.image;
        preview.classList.add("visible");
      });
      link.addEventListener("mouseleave", () => {
        preview.classList.remove("visible");
      });
      link.addEventListener("mousemove", (e) => {
        preview.style.left = e.clientX + 20 + "px";
        preview.style.top = e.clientY + 20 + "px";
      });
    });
  </script>
